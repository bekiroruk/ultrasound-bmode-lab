[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ultrasound-bmode-lab"
version = "0.6.0"
description = "Measured-RF ultrasound beamforming, phantom validation, quality metrics, and acceleration."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bekir Oruk" }]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "h5py>=3.11",
  "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]
accelerated = ["numba>=0.60"]
datasets = ["remotezip>=0.12"]

[project.scripts]
ultrasound-bmode = "ultrasound_bmode.cli:main"
ultrasound-real = "ultrasound_bmode.real_cli:main"
ultrasound-benchmark = "ultrasound_bmode.benchmark_cli:main"
ultrasound-adaptive = "ultrasound_bmode.advanced_cli:main"
ultrasound-phantom = "ultrasound_bmode.phantom_cli:main"
ultrasound-enhance = "ultrasound_bmode.enhancement_cli:main"
ultrasound-accelerate = "ultrasound_bmode.acceleration_cli:main"
ultrasound-roi = "ultrasound_bmode.roi_cli:main"
ultrasound-external = "ultrasound_bmode.external_validation_cli:main"
ultrasound-quality = "ultrasound_bmode.reconstruction_quality_cli:main"
ultrasound-validate-analytic = "ultrasound_bmode.analytic_validation_cli:main"
ultrasound-aperture-study = "ultrasound_bmode.aperture_study_cli:main"
ultrasound-profile = "ultrasound_bmode.runtime_profile_cli:main"


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
